<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Curva del Olvido — Repaso espaciado</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Olvido">
<meta name="application-name" content="Curva del Olvido">
<meta name="theme-color" content="#17332D">
<meta name="description" content="Seguimiento de repaso espaciado: 1, 3, 7, 15 y 30 días.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --paper:#EEF2EF;
    --paper-line:#CFDBD5;
    --ink:#17332D;
    --ink-soft:#4E6961;
    --ink-faint:#8CA39B;
    --card:#F8FAF9;
    --amber:#D9A441;
    --amber-soft:#F3E1BD;
    --rose:#B94A56;
    --rose-soft:#F0D3D3;
    --sage:#5C8A6E;
    --sage-soft:#D9E7DC;
    --line-strong:#17332D;
    --topic-1:#2D6E7E;
    --topic-2:#8B5E3C;
    --topic-3:#6B4E71;
    --topic-4:#4C6444;
    --topic-5:#A6763D;
    --topic-6:#3C5A72;
    --radius:10px;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px;}

  header{margin-bottom:18px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  h1{
    font-family:var(--serif);
    font-size:30px;
    font-weight:700;
    margin:0 0 4px;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  .subtitle{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0;
  }

  .hero{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:16px 18px;
    margin:18px 0;
  }
  .hero-num{
    font-family:var(--serif);
    font-size:42px;
    font-weight:700;
    line-height:1;
    color:var(--rose);
    min-width:52px;
  }
  .hero-num.zero{color:var(--sage);}
  .hero-text{font-size:13.5px;color:var(--ink-soft);line-height:1.4;}
  .hero svg{margin-left:auto;flex-shrink:0;opacity:.85;}

  .card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:18px;
  }
  .card h2{
    font-family:var(--serif);
    font-size:16.5px;
    margin:0 0 12px;
    color:var(--ink);
  }

  form.add-form{display:flex;flex-direction:column;gap:10px;}
  .field label{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .field input{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--paper-line);
    border-radius:7px;
    background:#fff;
    font-size:15px;
    font-family:var(--sans);
    color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--topic-1);outline-offset:1px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  button.primary{
    margin-top:2px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:7px;
    padding:11px 14px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    font-family:var(--sans);
  }
  button.primary:active{transform:translateY(1px);}
  button.primary:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  .todaylist{display:flex;flex-direction:column;gap:8px;}
  .todaylist .empty{font-size:13.5px;color:var(--ink-soft);font-style:italic;}
  .today-chip{
    display:flex;align-items:center;gap:10px;
    padding:9px 11px;
    border-radius:8px;
    background:#fff;
    border:1px solid var(--paper-line);
    cursor:pointer;
    text-align:left;
    font-family:var(--sans);
    font-size:14px;
    color:var(--ink);
  }
  .today-chip:focus-visible{outline:2px solid var(--amber);}
  .today-chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .today-chip .interval{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);}
  .today-chip.overdue{border-color:var(--rose);background:var(--rose-soft);}

  .todaylist-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .todaylist-nav button{
    background:none;border:1px solid var(--paper-line);border-radius:7px;
    width:30px;height:30px;font-size:15px;cursor:pointer;color:var(--ink);flex-shrink:0;
  }
  .todaylist-nav .date-label{
    font-family:var(--serif);font-size:15.5px;font-weight:700;text-align:center;flex:1;
    text-transform:capitalize;
  }
  .todaylist-nav .date-label small{
    display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--ink-soft);
    text-transform:none;margin-top:1px;
  }

  /* calendar */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav button{
    background:none;border:1px solid var(--paper-line);border-radius:7px;
    width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--ink);
  }
  .cal-nav .month-label{
    font-family:var(--serif);font-size:17px;font-weight:700;text-transform:capitalize;
  }
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .weekdays div{
    text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
    letter-spacing:.05em;
  }
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .day{
    min-height:76px;
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:7px;
    padding:4px;
    display:flex;flex-direction:column;gap:3px;
    overflow:hidden;
  }
  .day.empty{background:transparent;border-color:transparent;}
  .day:not(.empty){cursor:pointer;}
  .day:not(.empty):active{background:var(--paper-line);}
  .day .daynum{
    font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);align-self:flex-end;
  }
  .day.today{border-color:var(--ink);border-width:1.5px;}
  .day.today .daynum{color:var(--ink);font-weight:700;}
  .chips{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;}
  .chip{
    font-size:9.5px;
    line-height:1.3;
    padding:2px 4px;
    border-radius:4px;
    cursor:pointer;
    font-family:var(--sans);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border:1px solid transparent;
  }
  .chip.future{background:transparent;color:var(--ink-soft);border-color:var(--paper-line);}
  .chip.due{background:var(--amber-soft);color:var(--ink);border-color:var(--amber);font-weight:600;}
  .chip.overdue{background:var(--rose-soft);color:var(--ink);border-color:var(--rose);font-weight:600;}
  .chip.done-low{background:var(--rose);color:#fff;}
  .chip.done-mid{background:var(--amber);color:var(--ink);}
  .chip.done-high{background:var(--sage);color:#fff;}

  /* topics panel */
  .topic-row{padding:10px 0;border-bottom:1px solid var(--paper-line);}
  .topic-row:last-child{border-bottom:none;}
  .topic-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .topic-head .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .topic-head .name{font-size:14.5px;font-weight:600;flex:1;}
  .topic-head .del{
    background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:15px;
    padding:2px 6px;
  }
  .track{display:flex;align-items:center;position:relative;padding:0 4px;}
  .track .line{position:absolute;left:14px;right:14px;top:13px;height:1px;background:var(--paper-line);z-index:0;}
  .track-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:1;}
  .track-item .node{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;font-weight:600;
    background:#fff;border:2px solid var(--paper-line);color:var(--ink-faint);
    cursor:pointer;
  }
  .track-item .node.pending-future{border-color:var(--paper-line);color:var(--ink-faint);}
  .track-item .node.pending-due{border-color:var(--amber);background:var(--amber-soft);color:var(--ink);}
  .track-item .node.pending-overdue{border-color:var(--rose);background:var(--rose-soft);color:var(--ink);}
  .track-item .node.done-low{border-color:var(--rose);background:var(--rose);color:#fff;}
  .track-item .node.done-mid{border-color:var(--amber);background:var(--amber);color:var(--ink);}
  .track-item .node.done-high{border-color:var(--sage);background:var(--sage);color:#fff;}
  .track-item .lbl{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);}

  .empty-state{font-size:13.5px;color:var(--ink-soft);font-style:italic;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(23,51,45,.45);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card);
    width:100%;max-width:420px;
    border-radius:14px 14px 0 0;
    padding:20px 20px 24px;
    animation:slideup .18s ease;
  }
  @media (min-width:600px){
    .overlay{align-items:center;}
    .modal{border-radius:14px;}
  }
  @keyframes slideup{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h3{font-family:var(--serif);font-size:18px;margin:0 0 2px;text-transform:capitalize;}
  .daylist{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px;max-height:50vh;overflow-y:auto;}
  .daylist .empty{font-size:13.5px;color:var(--ink-soft);font-style:italic;}
  .day-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 11px;border-radius:8px;background:#fff;
    border:1px solid var(--paper-line);cursor:pointer;text-align:left;
    font-family:var(--sans);font-size:14.5px;color:var(--ink);width:100%;
  }
  .day-item .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .day-item .name{flex:1;}
  .day-item .badge{font-family:var(--mono);font-size:11px;color:var(--ink-soft);}
  .day-item.status-overdue{border-color:var(--rose);background:var(--rose-soft);}
  .day-item.status-due{border-color:var(--amber);background:var(--amber-soft);}
  .day-item.status-done-low{background:var(--rose);color:#fff;}
  .day-item.status-done-mid{background:var(--amber-soft);border-color:var(--amber);}
  .day-item.status-done-high{background:var(--sage-soft);border-color:var(--sage);}
  .day-item.status-done-low .badge{color:#fff;}
  .modal .meta{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;font-family:var(--mono);}
  .qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;}
  .qbtn{
    padding:12px 0;border-radius:8px;border:1.5px solid var(--paper-line);
    background:#fff;font-family:var(--mono);font-size:15px;font-weight:600;
    cursor:pointer;color:var(--ink);
  }
  .qbtn.selected{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .qbtn.low{border-color:var(--rose);}
  .qbtn.mid{border-color:var(--amber);}
  .qbtn.high{border-color:var(--sage);}
  .qbtn.low.selected{background:var(--rose);border-color:var(--rose);}
  .qbtn.mid.selected{background:var(--amber);border-color:var(--amber);color:var(--ink);}
  .qbtn.high.selected{background:var(--sage);border-color:var(--sage);}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{flex:1;padding:11px;border-radius:8px;font-size:14px;cursor:pointer;font-family:var(--sans);font-weight:600;}
  .btn-cancel{background:none;border:1px solid var(--paper-line);color:var(--ink-soft);}
  .btn-save{background:var(--ink);border:none;color:var(--paper);}
  .btn-save:disabled{opacity:.4;cursor:not-allowed;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;
    font-size:13.5px;opacity:0;transition:all .25s ease;pointer-events:none;z-index:60;
    max-width:88%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    .modal{animation:none;}
    .toast{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
      <div>
        <p class="eyebrow">Repaso espaciado</p>
        <h1>Curva del Olvido</h1>
        <p class="subtitle">Cada tema que estudias vuelve a ti en 1, 3, 7, 15 y 30 días.</p>
      </div>
      <button id="syncBtn" type="button" aria-label="Sincronización" style="background:none;border:1px solid var(--paper-line);border-radius:7px;width:34px;height:34px;font-size:15px;cursor:pointer;flex-shrink:0;color:var(--ink-soft);">⇅</button>
    </div>
  </header>

  <div class="hero">
    <div>
      <div class="hero-num" id="heroNum">0</div>
    </div>
    <p class="hero-text" id="heroText">repasos te tocan hoy</p>
    <svg width="90" height="46" viewBox="0 0 90 46" fill="none">
      <path d="M2 6 C 20 8, 26 30, 40 34 C 54 38, 60 40, 88 41" stroke="#5C8A6E" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="6" cy="6.4" r="2.6" fill="#B94A56"/>
      <circle cx="24" cy="13" r="2.6" fill="#D9A441"/>
      <circle cx="42" cy="30.5" r="2.6" fill="#D9A441"/>
      <circle cx="58" cy="37" r="2.6" fill="#5C8A6E"/>
      <circle cx="86" cy="41" r="2.6" fill="#5C8A6E"/>
    </svg>
  </div>

  <div class="card">
    <h2>¿Qué has estudiado?</h2>
    <form class="add-form" id="addForm">
      <div class="field">
        <label for="topicInput">Tema</label>
        <input id="topicInput" type="text" placeholder="p. ej. Derivadas parciales" required maxlength="60">
      </div>
      <div class="row2">
        <div class="field">
          <label for="dateInput">Fecha de estudio</label>
          <input id="dateInput" type="date" required>
        </div>
      </div>
      <button type="submit" class="primary">Programar repasos (1·3·7·15·30 días)</button>
    </form>
  </div>

  <div class="card">
    <h2 id="todayCardTitle">Hoy toca</h2>
    <div class="todaylist-nav">
      <button id="prevDay" aria-label="Día anterior" type="button">‹</button>
      <div class="date-label" id="dayNavLabel"></div>
      <button id="nextDay" aria-label="Día siguiente" type="button">›</button>
    </div>
    <div class="todaylist" id="todayList"></div>
  </div>

  <div class="card">
    <div class="cal-nav">
      <button id="prevMonth" aria-label="Mes anterior">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth" aria-label="Mes siguiente">›</button>
    </div>
    <div class="weekdays">
      <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
    </div>
    <div class="grid" id="calGrid"></div>
  </div>

  <div class="card">
    <h2>Temas activos</h2>
    <div id="topicsPanel"></div>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTopic">Tema</h3>
    <p class="meta" id="modalMeta"></p>
    <div class="qgrid" id="qGrid"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">Cancelar</button>
      <button class="btn-save" id="modalSave" disabled>Guardar repaso</button>
    </div>
  </div>
</div>

<div class="overlay" id="dayOverlay">
  <div class="modal">
    <h3 id="dayModalTitle">Día</h3>
    <p class="meta" id="dayModalMeta"></p>
    <div class="daylist" id="dayModalList"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="dayModalClose" style="flex:none;width:100%;">Cerrar</button>
    </div>
  </div>
</div>

<div class="overlay" id="syncOverlay">
  <div class="modal">
    <h3>Sincronizar entre dispositivos</h3>
    <p class="meta">Usa el mismo código en todos tus móviles para compartir el progreso.</p>
    <div class="field" style="margin:14px 0 6px;">
      <label for="syncCodeInput">Tu código de sincronización</label>
      <input id="syncCodeInput" type="text" placeholder="p. ej. diego-estudio-2026" maxlength="60">
    </div>
    <p class="meta" id="syncStatus" style="margin-bottom:14px;"></p>
    <div class="modal-actions">
      <button class="btn-cancel" id="syncClose">Cerrar</button>
      <button class="btn-save" id="syncSaveCode">Guardar y sincronizar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>


<script>
(function(){
  "use strict";

  var STORAGE_KEY = "oblivion_reviews_v1";
  var COLORS_KEY = "oblivion_topic_colors_v1";
  var SYNC_CODE_KEY = "oblivion_sync_code_v1";
  var INTERVALS = [1,3,7,15,30];
  var TOPIC_PALETTE = ["var(--topic-1)","var(--topic-2)","var(--topic-3)","var(--topic-4)","var(--topic-5)","var(--topic-6)"];
  var MONTHS_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

  // ⚠️ CONFIGURA AQUÍ TU BASE DE DATOS DE FIREBASE (Realtime Database).
  // Pega la URL que te da Firebase, algo como:
  // "https://tu-proyecto-default-rtdb.europe-west1.firebasedatabase.app"
  // Mientras esté vacía, la app funciona en local sin sincronizar.
  var FIREBASE_DB_URL = "";

  var reviews = loadReviews();
  var topicColors = loadColors();
  var today = new Date();
  var todayStr = fmtDate(today);
  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth();
  var pendingModalReviewId = null;
  var stagedQuality = null;
  var selectedDate = todayStr;
  var syncPushTimer = null;
  var isSyncing = false;

  function loadReviews(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e){ return []; }
  }
  function loadColors(){
    try { return JSON.parse(localStorage.getItem(COLORS_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveAll(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
    localStorage.setItem(COLORS_KEY, JSON.stringify(topicColors));
    scheduleCloudPush();
  }

  function fmtDate(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }
  function addDaysToStr(dateStr, n){
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate()+n);
    return fmtDate(d);
  }
  function prettyDate(dateStr){
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    return d.getDate()+" de "+MONTHS_ES[d.getMonth()];
  }
  function parseDateStr(dateStr){
    var parts = dateStr.split("-").map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  // Los domingos no se estudia: cualquier repaso que caiga en domingo pasa al lunes siguiente.
  function skipSunday(dateStr){
    var d = parseDateStr(dateStr);
    if(d.getDay()===0){ d.setDate(d.getDate()+1); return fmtDate(d); }
    return dateStr;
  }

  function getTopicColor(topic){
    if(!topicColors[topic]){
      var used = Object.keys(topicColors).length;
      topicColors[topic] = TOPIC_PALETTE[used % TOPIC_PALETTE.length];
    }
    return topicColors[topic];
  }

  function qualityBucket(q){
    if(q===null || q===undefined) return null;
    if(q<=4) return "low";
    if(q<=7) return "mid";
    return "high";
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  // ---------- add topic ----------
  document.getElementById("dateInput").value = todayStr;

  document.getElementById("addForm").addEventListener("submit", function(e){
    e.preventDefault();
    var topic = document.getElementById("topicInput").value.trim();
    var studyDate = document.getElementById("dateInput").value || todayStr;
    if(!topic) return;
    getTopicColor(topic);
    INTERVALS.forEach(function(interval){
      reviews.push({
        id: Date.now()+"-"+interval+"-"+Math.random().toString(36).slice(2,7),
        topic: topic,
        studyDate: studyDate,
        dueDate: skipSunday(addDaysToStr(studyDate, interval)),
        interval: interval,
        quality: null,
        updatedAt: Date.now()
      });
    });
    saveAll();
    document.getElementById("topicInput").value = "";
    document.getElementById("dateInput").value = todayStr;
    showToast("Repasos de \u201c"+topic+"\u201d programados a 1, 3, 7, 15 y 30 d\u00edas.");
    renderAll();
  });

  // ---------- hero (siempre el estado real de hoy) ----------
  function renderHero(){
    var due = reviews.filter(function(r){ return r.quality===null && r.dueDate<=todayStr; });
    var heroNum = document.getElementById("heroNum");
    var heroText = document.getElementById("heroText");
    heroNum.textContent = due.length;
    heroNum.className = "hero-num"+(due.length===0?" zero":"");
    heroText.textContent = due.length===1 ? "repaso te toca hoy" : "repasos te tocan hoy";
  }

  // ---------- lista navegable por fecha ----------
  function dayLabelFor(dateStr){
    if(dateStr===todayStr) return "Hoy";
    var d = parseDateStr(dateStr);
    var wd = ["domingo","lunes","martes","mi\u00e9rcoles","jueves","viernes","s\u00e1bado"][d.getDay()];
    return wd;
  }

  function renderTodayList(){
    document.getElementById("todayCardTitle").textContent =
      selectedDate===todayStr ? "Hoy toca" : (selectedDate<todayStr ? "Repasos de ese d\u00eda" : "Repasos programados");
    document.getElementById("dayNavLabel").innerHTML =
      dayLabelFor(selectedDate)+"<small>"+prettyDate(selectedDate)+"</small>";

    var container = document.getElementById("todayList");
    container.innerHTML = "";
    var dayReviews = reviews.filter(function(r){ return r.dueDate===selectedDate; });
    dayReviews.sort(function(a,b){ return a.interval-b.interval; });

    if(dayReviews.length===0){
      container.innerHTML = '<div class="empty">'+
        (selectedDate===todayStr ? "Sin repasos pendientes hoy. Buen ritmo." : "No hay repasos programados este d\u00eda.")+
        '</div>';
      return;
    }
    dayReviews.forEach(function(r){
      var el = document.createElement("button");
      el.type = "button";
      var overdue = r.quality===null && r.dueDate<todayStr;
      var done = r.quality!==null;
      el.className = "today-chip"+(overdue?" overdue":"");
      el.innerHTML =
        '<span class="dot" style="background:'+getTopicColor(r.topic)+'"></span>'+
        '<span>'+escapeHtml(r.topic)+'</span>'+
        '<span class="interval">'+
          (done ? "nota "+r.quality+"/10" : "D+"+r.interval+(overdue?" · atrasado":""))+
        '</span>';
      el.addEventListener("click", function(){ openModal(r.id); });
      container.appendChild(el);
    });
  }

  document.getElementById("prevDay").addEventListener("click", function(){
    selectedDate = addDaysToStr(selectedDate, -1);
    renderTodayList();
  });
  document.getElementById("nextDay").addEventListener("click", function(){
    selectedDate = addDaysToStr(selectedDate, 1);
    renderTodayList();
  });

  // ---------- calendar ----------
  function renderCalendar(){
    document.getElementById("monthLabel").textContent = MONTHS_ES[viewMonth]+" "+viewYear;
    var grid = document.getElementById("calGrid");
    grid.innerHTML = "";

    var firstOfMonth = new Date(viewYear, viewMonth, 1);
    var firstWeekday = (firstOfMonth.getDay()+6)%7; // Monday=0
    var daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    var totalCells = Math.ceil((firstWeekday+daysInMonth)/7)*7;

    for(var i=0;i<totalCells;i++){
      var dayNum = i - firstWeekday + 1;
      var cell = document.createElement("div");
      if(dayNum<1 || dayNum>daysInMonth){
        cell.className = "day empty";
        grid.appendChild(cell);
        continue;
      }
      let dateStr = viewYear+"-"+String(viewMonth+1).padStart(2,"0")+"-"+String(dayNum).padStart(2,"0");
      cell.className = "day"+(dateStr===todayStr?" today":"");
      var num = document.createElement("div");
      num.className = "daynum";
      num.textContent = dayNum;
      cell.appendChild(num);

      var chipsWrap = document.createElement("div");
      chipsWrap.className = "chips";
      var dayReviews = reviews.filter(function(r){ return r.dueDate===dateStr; });
      dayReviews.sort(function(a,b){ return a.interval-b.interval; });
      dayReviews.forEach(function(r){
        var chip = document.createElement("div");
        var status;
        if(r.quality!==null){
          status = "done-"+qualityBucket(r.quality);
        } else if(r.dueDate<todayStr){
          status = "overdue";
        } else if(r.dueDate===todayStr){
          status = "due";
        } else {
          status = "future";
        }
        chip.className = "chip "+status;
        chip.textContent = r.topic+" +"+r.interval;
        chip.title = r.topic+" — repaso a "+r.interval+" d\u00edas";
        chip.addEventListener("click", function(e){
          e.stopPropagation();
          if(r.quality!==null || r.dueDate<=todayStr){
            openModal(r.id);
          } else {
            showToast("Repaso de \u201c"+r.topic+"\u201d programado para el "+prettyDate(r.dueDate)+". A\u00fan no toca.");
          }
        });
        chipsWrap.appendChild(chip);
      });
      cell.appendChild(chipsWrap);
      cell.addEventListener("click", function(){ openDayModal(dateStr); });
      grid.appendChild(cell);
    }
  }

  document.getElementById("prevMonth").addEventListener("click", function(){
    viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;}
    renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", function(){
    viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;}
    renderCalendar();
  });

  // ---------- topics panel ----------
  function renderTopicsPanel(){
    var panel = document.getElementById("topicsPanel");
    panel.innerHTML = "";
    var topics = [];
    reviews.forEach(function(r){ if(topics.indexOf(r.topic)===-1) topics.push(r.topic); });

    if(topics.length===0){
      panel.innerHTML = '<div class="empty-state">A\u00fan no has registrado ning\u00fan tema.</div>';
      return;
    }

    topics.forEach(function(topic){
      var row = document.createElement("div");
      row.className = "topic-row";

      var head = document.createElement("div");
      head.className = "topic-head";
      head.innerHTML =
        '<span class="dot" style="background:'+getTopicColor(topic)+'"></span>'+
        '<span class="name">'+escapeHtml(topic)+'</span>';
      var delBtn = document.createElement("button");
      delBtn.className = "del";
      delBtn.setAttribute("aria-label","Eliminar tema");
      delBtn.textContent = "\u00d7";
      delBtn.addEventListener("click", function(){
        if(confirm('¿Eliminar "'+topic+'" y todos sus repasos programados?')){
          reviews = reviews.filter(function(r){ return r.topic!==topic; });
          delete topicColors[topic];
          saveAll();
          renderAll();
        }
      });
      head.appendChild(delBtn);
      row.appendChild(head);

      var track = document.createElement("div");
      track.className = "track";
      track.innerHTML = '<div class="line"></div>';
      INTERVALS.forEach(function(interval){
        var r = reviews.find(function(rv){ return rv.topic===topic && rv.interval===interval; });
        var item = document.createElement("div");
        item.className = "track-item";
        var node = document.createElement("div");
        var status;
        if(!r){ status="pending-future"; }
        else if(r.quality!==null){ status="done-"+qualityBucket(r.quality); }
        else if(r.dueDate<todayStr){ status="pending-overdue"; }
        else if(r.dueDate===todayStr){ status="pending-due"; }
        else { status="pending-future"; }
        node.className = "node "+status;
        node.textContent = r && r.quality!==null ? r.quality : (interval);
        if(r){
          node.addEventListener("click", function(){
            if(r.quality!==null || r.dueDate<=todayStr){ openModal(r.id); }
            else { showToast("Repaso programado para el "+prettyDate(r.dueDate)+"."); }
          });
        }
        var lbl = document.createElement("div");
        lbl.className = "lbl";
        lbl.textContent = interval+"d";
        item.appendChild(node);
        item.appendChild(lbl);
        track.appendChild(item);
      });
      row.appendChild(track);
      panel.appendChild(row);
    });
  }

  // ---------- modal ----------
  function openModal(reviewId){
    var r = reviews.find(function(rv){ return rv.id===reviewId; });
    if(!r) return;
    pendingModalReviewId = reviewId;
    stagedQuality = r.quality;
    document.getElementById("modalTopic").textContent = r.topic;
    document.getElementById("modalMeta").textContent =
      "Repaso a "+r.interval+" d\u00edas · programado para el "+prettyDate(r.dueDate);

    var qGrid = document.getElementById("qGrid");
    qGrid.innerHTML = "";
    for(var q=1;q<=10;q++){
      (function(q){
        var btn = document.createElement("button");
        btn.type="button";
        var bucket = q<=4?"low":(q<=7?"mid":"high");
        btn.className = "qbtn "+bucket+(stagedQuality===q?" selected":"");
        btn.textContent = q;
        btn.addEventListener("click", function(){
          stagedQuality = q;
          Array.prototype.forEach.call(qGrid.children, function(c){ c.classList.remove("selected"); });
          btn.classList.add("selected");
          document.getElementById("modalSave").disabled = false;
        });
        qGrid.appendChild(btn);
      })(q);
    }
    document.getElementById("modalSave").disabled = stagedQuality===null;
    document.getElementById("dayOverlay").classList.remove("open");
    document.getElementById("overlay").classList.add("open");
  }
  function closeModal(){
    document.getElementById("overlay").classList.remove("open");
    pendingModalReviewId = null;
    stagedQuality = null;
  }

  // ---------- day modal (día ampliado del calendario) ----------
  function openDayModal(dateStr){
    var dayReviews = reviews.filter(function(r){ return r.dueDate===dateStr; });
    dayReviews.sort(function(a,b){ return a.interval-b.interval; });

    document.getElementById("dayModalTitle").textContent = dayLabelFor(dateStr);
    document.getElementById("dayModalMeta").textContent = prettyDate(dateStr)+
      (dateStr===todayStr ? " · hoy" : "");

    var list = document.getElementById("dayModalList");
    list.innerHTML = "";
    if(dayReviews.length===0){
      list.innerHTML = '<div class="empty">No hay temas programados para este d\u00eda.</div>';
    } else {
      dayReviews.forEach(function(r){
        var el = document.createElement("button");
        el.type = "button";
        var status;
        if(r.quality!==null){ status = "status-done-"+qualityBucket(r.quality); }
        else if(r.dueDate<todayStr){ status = "status-overdue"; }
        else if(r.dueDate===todayStr){ status = "status-due"; }
        else { status = "status-future"; }
        el.className = "day-item "+status;
        el.innerHTML =
          '<span class="dot" style="background:'+getTopicColor(r.topic)+'"></span>'+
          '<span class="name">'+escapeHtml(r.topic)+'</span>'+
          '<span class="badge">'+(r.quality!==null ? "nota "+r.quality+"/10" : "repaso +"+r.interval+"d")+'</span>';
        el.addEventListener("click", function(){
          if(r.quality!==null || r.dueDate<=todayStr){
            openModal(r.id);
          } else {
            showToast("Repaso de \u201c"+r.topic+"\u201d programado para el "+prettyDate(r.dueDate)+". A\u00fan no toca.");
          }
        });
        list.appendChild(el);
      });
    }
    document.getElementById("dayOverlay").classList.add("open");
  }
  function closeDayModal(){
    document.getElementById("dayOverlay").classList.remove("open");
  }
  document.getElementById("dayModalClose").addEventListener("click", closeDayModal);
  document.getElementById("dayOverlay").addEventListener("click", function(e){
    if(e.target.id==="dayOverlay") closeDayModal();
  });
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("overlay").addEventListener("click", function(e){
    if(e.target.id==="overlay") closeModal();
  });
  document.getElementById("modalSave").addEventListener("click", function(){
    if(stagedQuality===null || !pendingModalReviewId) return;
    var r = reviews.find(function(rv){ return rv.id===pendingModalReviewId; });
    if(r){
      r.quality = stagedQuality;
      r.updatedAt = Date.now();
      saveAll();
      showToast("Repaso de \u201c"+r.topic+"\u201d guardado con nota "+stagedQuality+"/10.");
    }
    closeModal();
    renderAll();
  });

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderAll(){
    renderHero();
    renderTodayList();
    renderCalendar();
    renderTopicsPanel();
  }

  // ---------- sincronización entre dispositivos ----------
  function getSyncCode(){
    try { return localStorage.getItem(SYNC_CODE_KEY) || ""; }
    catch(e){ return ""; }
  }
  function setSyncCode(code){
    try { localStorage.setItem(SYNC_CODE_KEY, code); } catch(e){}
  }
  function cloudUrl(code){
    return FIREBASE_DB_URL.replace(/\/$/,"") + "/syncs/" + encodeURIComponent(code) + ".json";
  }
  function setSyncStatus(msg){
    var el = document.getElementById("syncStatus");
    if(el) el.textContent = msg;
  }
  function saveLocalOnly(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
    localStorage.setItem(COLORS_KEY, JSON.stringify(topicColors));
  }

  function scheduleCloudPush(){
    if(!FIREBASE_DB_URL || !getSyncCode()) return;
    clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(pushToCloud, 900);
  }

  function pushToCloud(){
    var code = getSyncCode();
    if(!FIREBASE_DB_URL || !code) return;
    var colorList = Object.keys(topicColors).map(function(topic){
      return { topic: topic, color: topicColors[topic] };
    });
    var payload = { reviews: reviews, topicColorsList: colorList, updatedAt: Date.now() };
    fetch(cloudUrl(code), {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    }).then(function(res){
      if(res.ok){
        setSyncStatus("Sincronizado \u00b7 "+new Date().toLocaleTimeString());
      } else {
        res.text().then(function(t){
          setSyncStatus("No se pudo sincronizar (error "+res.status+"). Revisa la configuraci\u00f3n de Firebase.");
          console.error("Firebase push error", res.status, t);
        });
      }
    }).catch(function(){
      setSyncStatus("Sin conexi\u00f3n. Se sincronizar\u00e1 cuando vuelva el internet.");
    });
  }

  function mergeCloudData(cloud){
    if(!cloud) return;
    var cloudReviews = cloud.reviews || [];
    var map = {};
    reviews.forEach(function(r){ map[r.id] = r; });
    cloudReviews.forEach(function(cr){
      var local = map[cr.id];
      if(!local || (cr.updatedAt||0) > (local.updatedAt||0)){
        map[cr.id] = cr;
      }
    });
    reviews = Object.keys(map).map(function(k){ return map[k]; });

    var cloudColors = {};
    if(cloud.topicColorsList){
      cloud.topicColorsList.forEach(function(item){ cloudColors[item.topic] = item.color; });
    } else if(cloud.topicColors){
      cloudColors = cloud.topicColors; // formato antiguo, por compatibilidad
    }
    var mergedColors = {};
    for(var k1 in cloudColors) mergedColors[k1] = cloudColors[k1];
    for(var k2 in topicColors) mergedColors[k2] = topicColors[k2];
    topicColors = mergedColors;
    saveLocalOnly();
  }

  function pullFromCloud(showFeedback){
    var code = getSyncCode();
    if(!FIREBASE_DB_URL || !code) return;
    fetch(cloudUrl(code))
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(data){
        if(data){
          mergeCloudData(data);
          renderAll();
        }
        if(showFeedback) setSyncStatus("Sincronizado \u00b7 "+new Date().toLocaleTimeString());
      })
      .catch(function(){
        if(showFeedback) setSyncStatus("Sin conexi\u00f3n. Mostrando lo guardado en este dispositivo.");
      });
  }

  document.getElementById("syncBtn").addEventListener("click", function(){
    var code = getSyncCode();
    document.getElementById("syncCodeInput").value = code;
    if(!FIREBASE_DB_URL){
      setSyncStatus("Sincronizaci\u00f3n a\u00fan no configurada en el c\u00f3digo de la app.");
    } else if(!code){
      setSyncStatus("A\u00fan no has puesto un c\u00f3digo en este dispositivo.");
    } else {
      setSyncStatus("C\u00f3digo activo: sincronizando autom\u00e1ticamente.");
    }
    document.getElementById("syncOverlay").classList.add("open");
  });
  document.getElementById("syncClose").addEventListener("click", function(){
    document.getElementById("syncOverlay").classList.remove("open");
  });
  document.getElementById("syncOverlay").addEventListener("click", function(e){
    if(e.target.id==="syncOverlay") document.getElementById("syncOverlay").classList.remove("open");
  });
  document.getElementById("syncSaveCode").addEventListener("click", function(){
    var val = document.getElementById("syncCodeInput").value.trim();
    if(!val){ setSyncStatus("Escribe un c\u00f3digo antes de guardar."); return; }
    setSyncCode(val);
    if(!FIREBASE_DB_URL){
      setSyncStatus("Guardado en este dispositivo, pero falta configurar FIREBASE_DB_URL en el c\u00f3digo.");
      return;
    }
    setSyncStatus("Sincronizando\u2026");
    pullFromCloud(true);
    scheduleCloudPush();
  });

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") pullFromCloud(false);
  });
  window.addEventListener("online", function(){
    pullFromCloud(false);
    scheduleCloudPush();
  });

  renderAll();
  pullFromCloud(false);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      window.location.reload();
    });
  }
})();
</script>
</body>
</html>
